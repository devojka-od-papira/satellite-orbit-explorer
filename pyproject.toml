[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-explorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib", "sgp4>=2.27"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]
# The 3D viewer tests (tests/viewer); also needs `playwright install chromium`.
viewer = ["pytest", "playwright>=1.65.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbit_explorer = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
markers = ["viewer: opens the 3D viewer in a headless browser (needs the viewer extra)"]
