name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Smoke test outputs
        env:
          MPLBACKEND: Agg
        run: |
          python -m orbit_explorer.report
          python -m orbit_explorer.plots
          python -m orbit_explorer.kml
          for f in orbit_report.txt ground_tracks.png speeds.png geo_vs_igso.png orbits.kml; do
            test -s "outputs/$f" || { echo "Missing or empty: outputs/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: outputs
          path: outputs/
