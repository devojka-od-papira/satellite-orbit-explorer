name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # started by the data refresh, whose PRs don't trigger CI

permissions:
  contents: read # CI only reads the code

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  audit:
    # Fails if an installed dependency has a known vulnerability (PyPI advisory
    # database). The project itself is installed editable and not on PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,viewer]" pip-audit
      - run: pip-audit --skip-editable

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Smoke test outputs
        env:
          MPLBACKEND: Agg
        run: |
          python -m orbit_explorer.report
          python -m orbit_explorer.plots
          python -m orbit_explorer.kml
          python -m orbit_explorer.czml
          python -m orbit_explorer.sgp4_compare
          python -m orbit_explorer.j2
          python -m orbit_explorer.validation
          python -m orbit_explorer.visibility
          python -m orbit_explorer.archive summary
          python -m orbit_explorer.gnss summary
          python -m orbit_explorer.dop
          for f in orbit_report.txt ground_tracks.png speeds.png geo_vs_igso.png orbits.kml orbits.czml sgp4_comparison.txt sgp4_differences.png j2_comparison.txt j2_differences.png j2_node_drift.png validation.txt validation.png visibility.txt visibility_elevation.png visibility_skyplot.png dop.txt dop.png dop_world.png; do
            test -s "outputs/$f" || { echo "Missing or empty: outputs/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.13'
        with:
          name: outputs
          path: outputs/

  viewer:
    # The 3D viewer in headless Chromium: loading, panel, stations, passes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[viewer]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/viewer -v
        env:
          VIEWER_TESTS_REQUIRED: "1" # fail, never skip, if the browser is missing
